databaseChangeLog:
  - changeSet:
      id: insert-default-roles
      author: pcizminski
      changes:
        - insert:
            columns:
              - column:
                  name: role
                  value: USER
            tableName: roles
        - insert:
            columns:
              - column:
                  name: role
                  value: ADMIN
            tableName: roles
  - changeSet:
      id: insert-admin-user
      author: pcizminski
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: jane.doe@example.com

              - column:
                  name: password
                  value: '$2a$10$4BvScRFXROVux7dJUIH7h.TOYU2K4X2eFStJwSYggxLZtXKnv5jMu'

              - column:
                  name: first_name
                  value: Jane

              - column:
                  name: last_name
                  value: Doe

              - column:
                  name: shipping_address
                  value: null

              - column:
                  name: is_deleted
                  valueBoolean: false

  - changeSet:
      id: assign-admin-role-to-admin-user
      author: pcizminski
      changes:
        - sql:
            sql: >
              INSERT INTO users_roles (users_id, roles_id)
              SELECT u.id, r.id
              FROM users u
              CROSS JOIN roles r
              WHERE u.email = 'jane.doe@example.com'
              AND r.role = 'ADMIN';