databaseChangeLog:
  - changeSet:
      id: create-categories-table
      author: pcizminski
      changes:
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_categories
                  name: id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: is_deleted
                  type: BIT(1)
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
            tableName: categories
  - changeSet:
      id: add-unique-constraint-to-categories-name
      author: pcizminski
      changes:
        - addUniqueConstraint:
            columnNames: name
            constraintName: uc_categories_name
            tableName: categories