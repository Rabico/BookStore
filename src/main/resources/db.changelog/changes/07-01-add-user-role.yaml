databaseChangeLog:
  - changeSet:
      id: assign-user-role-to-admin-user
      author: pcizminski
      changes:
        - sql:
            sql: >
              INSERT INTO users_roles (users_id, roles_id)
              SELECT u.id, r.id
              FROM users u
              CROSS JOIN roles r
              WHERE u.email = 'jane.doe@example.com'
              AND r.role = 'USER';