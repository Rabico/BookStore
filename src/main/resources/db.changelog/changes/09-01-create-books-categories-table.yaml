databaseChangeLog:
  - changeSet:
      id: create-books-categories-table
      author: pcizminski
      changes:
        - createTable:
            columns:
              - column:
                    constraints:
                      nullable: false
                      primaryKey: true
                      primaryKeyName: pk_books_categories
                    name: books_id
                    type: BIGINT
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_books_categories
                  name: categories_id
                  type: BIGINT
            tableName: books_categories